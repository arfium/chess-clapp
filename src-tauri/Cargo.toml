[package]
name = "chess"
version = "0.2.0"
edition = "2021"
description = "Play chess with your agents — you-vs-agent or agent-vs-agent — cross-platform via clappkit + Tauri."
license = "Apache-2.0"

[[bin]]
name = "chess"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tauri` feature = the GUI half of the plumbing (icon, window verbs, the `asset`
# command, the GUI↔CLI relay). It pins the same tauri version + features this crate
# already declares, so it adds nothing to the dependency graph.
clappkit = { path = "../clappkit", features = ["tauri"] }
tauri = { version = "2", features = ["image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
shakmaty = "0.27"

# clappkit pins the clatch crates to a PRIVATE repository over ssh://. Building this app
# must not depend on holding a key for it — not on a CI runner, not on a fresh machine, not
# in five years — so the crates are vendored at the tag clappkit pins (vendor/clatch, copied
# verbatim from v0.4.3) and this patch points cargo at that copy.
#
# The URL must match clappkit's dependency URL character for character; that is how cargo
# knows which source it is replacing. Refresh with scripts/vendor-clatch.sh <tag>.
# `cargo build --offline --locked` is the standing proof that nothing private is reached.
[patch."ssh://git@github.com/arfium/clatch.git"]
clatch-core     = { path = "../vendor/clatch/crates/clatch-core" }
clatch-ipc      = { path = "../vendor/clatch/crates/clatch-ipc" }
clatch-pipe     = { path = "../vendor/clatch/crates/clatch-pipe" }
clatch-registry = { path = "../vendor/clatch/crates/clatch-registry" }
