[package]
name = "chess"
version = "0.2.0"
edition = "2021"
description = "Play chess with your agents — you-vs-agent or agent-vs-agent — cross-platform via clappkit + Tauri."
license = "Apache-2.0"

[[bin]]
name = "chess"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clappkit = { path = "../../clappkit" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
shakmaty = "0.27"
