[package]
name = "chess"
version = "0.3.0"
edition = "2021"
description = "Play chess with your agents — you-vs-agent or agent-vs-agent — cross-platform via clappkit + Tauri."
license = "Apache-2.0"

[[bin]]
name = "chess"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tauri` feature = the GUI half of the plumbing (icon, window verbs, the `asset`
# command, the GUI↔CLI relay). It pins the same tauri version + features this crate
# already declares, so it adds nothing to the dependency graph.
clappkit = { path = "../clappkit", features = ["tauri"] }
tauri = { version = "2", features = ["image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
shakmaty = "0.27"
