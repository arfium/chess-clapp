# Cut a distributable release. Push a version tag (e.g. `git tag v0.2.0 && git push
# --tags`) and this builds the host `.clapp` depot and publishes it as a GitHub
# Release asset. End users then install with no source checkout:
#
#   clatch install github:<owner>/<repo>            # latest release
#   clatch install github:<owner>/<repo>@v0.2.0     # a specific tag
#
# A `.clapp` is just a zip rooted at clatch.json (reference/launch.md § Distribution),
# named `<id>-<os>-<arch>.clapp`, so we build it with `zip` — no Clatch binary needed.
# The sibling `.sha256` is the corruption check Clatch verifies on download.
#
# ONE PLATFORM, THREE CLAIMED. clatch.json advertises macos, windows AND linux (the
# `launch` keys ARE the platform claim), and scripts/package.sh builds a correct depot on
# each — including the `.exe` binary and the `.exe` cliBin Windows needs. What is missing
# is the runner: this job needs the sibling `clappkit` (and the `clatch` crates it
# path-depends on) checked out beside the repo, and clappkit is not published yet. Once it
# is, make `os` a matrix — [macos-14 → macos/arm64, windows-latest → windows/x64,
# ubuntu-22.04 → linux/x64] — and upload all three assets from the same tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # gh release create

jobs:
  clapp:
    runs-on: macos-14    # Apple Silicon → macos/arm64 depot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: The manifest and the code must agree
        run: node scripts/check-manifest.mjs

      # package.sh prints exactly one line on stdout — the depot path (pkg/) — and
      # narrates on stderr, so this both runs the build and says where the artefact is.
      - name: Build + assemble the depot
        run: echo "DEPOT=$(sh scripts/package.sh)" >> "$GITHUB_ENV"

      - name: Pack the host .clapp (+ sha256)
        run: |
          set -eu
          id=$(node -p "require('./clatch.json').id")
          clapp="${id}-macos-arm64.clapp"
          ( cd "$DEPOT" && zip -r -q "$GITHUB_WORKSPACE/$clapp" . -x '*.DS_Store' )
          shasum -a 256 "$clapp" > "$clapp.sha256"
          echo "CLAPP=$clapp" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$CLAPP" "$CLAPP.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
